name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: catalog_starter
        ports: ["5470:5432"]
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6383:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Тестовые базы
        run: |
          for db in catalog_starter_test catalog catalog_test payments payments_test; do
            psql postgres://catalog:catalog@localhost:5470/catalog_starter -c "CREATE DATABASE $db OWNER catalog"
          done

      - name: Контракты и сервисы
        run: |
          pip install -e contracts/orders_v1 -e contracts/payments_v1
          pip install -e "services/catalog-starter[dev]" -e "services/catalog[dev]" -e "services/payment[dev]" -e "services/bff[dev]"

      - name: Проверка кода
        run: ruff check --select E4,E7,E9,F services/catalog-starter services/catalog services/payment services/bff

      - name: Тесты сервисов
        run: |
          for service in catalog-starter catalog payment bff; do
            (cd services/$service && python -m pytest -q) || exit 1
          done

      - name: Проверка манифестов, образа и пайплайна
        run: python3 tools/check-deploy.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: npm test --prefix web
