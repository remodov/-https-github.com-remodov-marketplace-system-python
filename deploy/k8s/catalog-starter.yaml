apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-starter
  labels:
    app: catalog-starter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-starter
  template:
    metadata:
      labels:
        app: catalog-starter
    spec:
      # TODO шаг 15: контейнер не должен бежать от root.
      containers:
        - name: app
          image: ghcr.io/remodov/catalog-starter-python:latest
          ports:
            - containerPort: 8182
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://catalog:catalog@postgres-catalog-starter:5432/catalog_starter
            - name: REDIS_URL
              value: redis://redis:6379
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          # TODO шаг 15: запросы и лимиты ресурсов, пробы готовности и живости,
          # корректное завершение. Без проб кластер считает под готовым сразу,
          # и первые запросы уходят в ещё не поднявшееся приложение.
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-starter
spec:
  selector:
    app: catalog-starter
  ports:
    - port: 80
      targetPort: 8182
